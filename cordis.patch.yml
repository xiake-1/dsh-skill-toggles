# dsh-skill-toggles bundle patch: mounts the toggle manager into the host
# composition of a dsh profile. The plugin registers skill_toggles_* tools
# into the shared tools registry and a per-agent shadow skill provider that
# suppresses skills no ACTIVE group enables (whitelist union: each group only
# contributes its own enabled skills; no active group = nothing usable).
- insert:
    - id: skill-toggles
      name: 'dsh-skill-toggles'
      config: {}
